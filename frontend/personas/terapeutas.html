<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terapeutas · Rayitos de Sol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="flex min-h-screen">
    <aside id="sidebar" class="w-64 flex-shrink-0 hidden lg:block"></aside>

    <div class="flex-1 flex flex-col min-w-0">
        <header class="topbar px-6 py-4 flex items-center justify-between lg:hidden">
            <h1 class="font-bold text-slate-800">☀️ Rayitos de Sol</h1>
        </header>
        <header class="topbar px-6 py-4 flex items-center justify-between sticky top-0 z-40">
            <div>
                <p class="text-xs text-slate-500 uppercase tracking-wide font-semibold">Personas</p>
                <h2 class="text-xl font-bold text-slate-800">Terapeutas</h2>
            </div>
            <button class="btn btn-primary" onclick="abrirModal('modal')">＋ Nuevo Terapeuta</button>
        </header>

        <main class="flex-1 p-6 space-y-6">
            <div class="page-hero flex items-center justify-between">
                <div>
                    <h3 class="text-lg font-bold">🩺 Profesionales de Terapia</h3>
                    <p class="text-sm text-slate-300 mt-1">Especialistas que prestan los servicios del centro</p>
                </div>
                <span class="text-4xl opacity-40 hidden md:block">💼</span>
            </div>

            <div class="card">
                <div class="p-4 border-b border-slate-100 flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between">
                    <div class="relative flex-1 max-w-md">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">🔍</span>
                        <input id="buscar" class="input pl-9" placeholder="Buscar por nombre, especialidad o cédula...">
                    </div>
                    <span id="contador" class="text-xs text-slate-500 font-medium"></span>
                </div>
                <div class="table-wrap">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th><th>Terapeuta</th><th>Cédula</th><th>Especialidad</th>
                                <th>Teléfono</th><th>Correo</th><th>Estado</th><th></th>
                            </tr>
                        </thead>
                        <tbody id="tabla"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div id="modal" class="hidden fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-4" onclick="cerrarModalConClick(event,'modal')">
        <div class="card modal-content w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-5">
                <h3 class="text-lg font-bold text-slate-800">🩺 Nuevo Terapeuta</h3>
                <button onclick="cerrarModal('modal')" class="text-slate-400 hover:text-slate-600 text-xl">✕</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><label class="text-xs font-semibold text-slate-600">Cédula *</label>
                    <input id="cedula" class="input mt-1" placeholder="Número de cédula"></div>
                <div><label class="text-xs font-semibold text-slate-600">Especialidad *</label>
                    <input id="especialidad" class="input mt-1" placeholder="Ej. Terapia física"></div>
                <div><label class="text-xs font-semibold text-slate-600">Nombres *</label>
                    <input id="nombres" class="input mt-1" placeholder="Nombres"></div>
                <div><label class="text-xs font-semibold text-slate-600">Apellidos *</label>
                    <input id="apellidos" class="input mt-1" placeholder="Apellidos"></div>
                <div><label class="text-xs font-semibold text-slate-600">Teléfono</label>
                    <input id="telefono" class="input mt-1" placeholder="09XXXXXXXX"></div>
                <div><label class="text-xs font-semibold text-slate-600">Correo</label>
                    <input id="correo" type="email" class="input mt-1" placeholder="correo@ejemplo.com"></div>
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button class="btn btn-ghost" onclick="cerrarModal('modal')">Cancelar</button>
                <button class="btn btn-primary" onclick="guardar()">💾 Guardar</button>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        cargarSidebar();

        async function cargar() {
            document.getElementById('tabla').innerHTML = spinnerHtml();
            let datos = [];
            try { datos = await api('/personas/terapeutas'); }
            catch (_) { document.getElementById('tabla').innerHTML = vacioHtml('Error al cargar'); return; }

            document.getElementById('contador').textContent = datos.length + ' registro(s)';
            if (!datos.length) { document.getElementById('tabla').innerHTML = vacioHtml(); return; }

            document.getElementById('tabla').innerHTML = datos.map(t => `
                <tr>
                    <td class="font-medium text-slate-500">#${t.id}</td>
                    <td>
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center text-sm font-bold">${iniciales(t.nombres, t.apellidos)}</div>
                            <p class="font-semibold text-slate-800">${escapeHtml(t.nombres)} ${escapeHtml(t.apellidos)}</p>
                        </div>
                    </td>
                    <td class="font-mono text-xs text-slate-600">${escapeHtml(t.cedula)}</td>
                    <td><span class="badge badge-purple">${escapeHtml(t.especialidad || 'General')}</span></td>
                    <td>${escapeHtml(t.telefono || '—')}</td>
                    <td>${escapeHtml(t.correo || '—')}</td>
                    <td>${badge(t.estado)}</td>
                    <td class="text-right whitespace-nowrap">
                        <button class="btn btn-ghost !px-2 !py-1" title="Eliminar" onclick="eliminar(${t.id})">🗑️</button>
                    </td>
                </tr>`).join('');

            initBusqueda('buscar', '#tabla tr');
        }

        function iniciales(n, a) { return ((n || '?')[0] || '') + ((a || '?')[0] || ''); }

        function validar() {
            let ok = true;
            ['cedula', 'nombres', 'apellidos', 'especialidad'].forEach(id => {
                const el = document.getElementById(id);
                const invalido = !el.value;
                el.classList.toggle('input-error', invalido);
                if (invalido) ok = false;
            });
            return ok;
        }

        async function guardar() {
            if (!validar()) { toast('Complete los campos obligatorios', 'error'); return; }
            const body = {
                cedula: document.getElementById('cedula').value,
                nombres: document.getElementById('nombres').value,
                apellidos: document.getElementById('apellidos').value,
                especialidad: document.getElementById('especialidad').value,
                telefono: document.getElementById('telefono').value,
                correo: document.getElementById('correo').value
            };
            try {
                await api('/personas/terapeutas', { method: 'POST', body: JSON.stringify(body) });
                toast('Terapeuta registrado correctamente');
                cerrarModal('modal');
                ['cedula','nombres','apellidos','especialidad','telefono','correo'].forEach(id => document.getElementById(id).value = '');
                cargar();
            } catch (e) { toast(e.message, 'error'); }
        }

        async function eliminar(id) {
            if (!(await confirmar('¿Eliminar este terapeuta?'))) return;
            try {
                await api('/personas/terapeutas/' + id, { method: 'DELETE' });
                toast('Terapeuta eliminado');
                cargar();
            } catch (e) { toast(e.message, 'error'); }
        }

        cargar();
    </script>
</body>
</html>
