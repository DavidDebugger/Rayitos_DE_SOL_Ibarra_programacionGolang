<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard · Rayitos de Sol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="flex min-h-screen">
    <aside id="sidebar" class="w-64 flex-shrink-0 hidden lg:block"></aside>

    <div class="flex-1 flex flex-col min-w-0">
        <!-- Topbar -->
        <header class="topbar px-6 py-4 flex items-center justify-between lg:hidden">
            <h1 class="font-bold text-slate-800">☀️ Rayitos de Sol</h1>
        </header>
        <header class="topbar px-6 py-4 flex items-center justify-between sticky top-0 z-40">
            <div>
                <p class="text-xs text-slate-500 uppercase tracking-wide font-semibold">Panel de control</p>
                <h2 class="text-xl font-bold text-slate-800">Dashboard</h2>
            </div>
            <div class="flex items-center gap-3">
                <span id="fecha-hoy" class="text-sm text-slate-500 font-medium"></span>
                <div class="w-10 h-10 rounded-full flex items-center justify-center text-lg shadow" style="background: linear-gradient(135deg, #f59e0b, #d97706);">👨‍💼</div>
            </div>
        </header>

        <main class="flex-1 p-6 space-y-6">
            <!-- Cards -->
            <div id="cards" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
                <div class="col-span-full"><div class="spinner"></div></div>
            </div>

            <!-- Gráficas -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="card p-5 lg:col-span-2">
                    <h3 class="font-bold text-slate-800 mb-1">Ingresos vs Gastos</h3>
                    <p class="text-xs text-slate-500 mb-4">Balance financiero del mes</p>
                    <div class="h-72"><canvas id="grafica-balance"></canvas></div>
                </div>
                <div class="card p-5">
                    <h3 class="font-bold text-slate-800 mb-1">Citas por estado</h3>
                    <p class="text-xs text-slate-500 mb-4">Distribución actual</p>
                    <div class="h-72"><canvas id="grafica-citas"></canvas></div>
                </div>
            </div>

            <!-- Indicadores rápidos -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="card p-5">
                    <div class="flex items-center gap-3 mb-3">
                        <div class="stat-icon bg-orange-100 text-orange-600">⏳</div>
                        <div>
                            <p class="font-bold text-slate-800" id="s-pendientes">0</p>
                            <p class="text-xs text-slate-500">Sesiones pendientes</p>
                        </div>
                    </div>
                </div>
                <div class="card p-5">
                    <div class="flex items-center gap-3 mb-3">
                        <div class="stat-icon bg-purple-100 text-purple-600">🔄</div>
                        <div>
                            <p class="font-bold text-slate-800" id="s-recuperaciones">0</p>
                            <p class="text-xs text-slate-500">Recuperaciones</p>
                        </div>
                    </div>
                </div>
                <div class="card p-5">
                    <div class="flex items-center gap-3 mb-3">
                        <div class="stat-icon bg-red-100 text-red-600">⚠️</div>
                        <div>
                            <p class="font-bold text-slate-800" id="s-inventario">0</p>
                            <p class="text-xs text-slate-500">Productos bajo stock</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="px-6 py-4 text-center text-xs text-slate-400 border-t border-slate-200 bg-white/60">
            ☀️ Rayitos de Sol · Sistema de Gestión del Centro de Terapias Infantiles
        </footer>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        cargarSidebar();
        document.getElementById('fecha-hoy').textContent =
            new Date().toLocaleDateString('es-EC', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

        const definicionCards = [
            { key: 'estudiantes_activos', titulo: 'Estudiantes Activos', icono: '👥', color: 'bg-blue-100 text-blue-600' },
            { key: 'representantes_total', titulo: 'Representantes', icono: '👤', color: 'bg-green-100 text-green-600' },
            { key: 'terapeutas_activos', titulo: 'Terapeutas Activos', icono: '🩺', color: 'bg-purple-100 text-purple-600' },
            { key: 'citas_del_dia', titulo: 'Citas de Hoy', icono: '📅', color: 'bg-orange-100 text-orange-600' },
            { key: 'ingresos_del_mes', titulo: 'Ingresos del Mes', icono: '💰', color: 'bg-teal-100 text-teal-600', dinero: true },
            { key: 'gastos_del_mes', titulo: 'Gastos del Mes', icono: '💸', color: 'bg-red-100 text-red-600', dinero: true },
            { key: 'balance_ganancia', titulo: 'Balance', icono: '📊', color: 'bg-indigo-100 text-indigo-600', dinero: true },
            { key: 'sesiones_pendientes', titulo: 'Sesiones Pendientes', icono: '⏳', color: 'bg-yellow-100 text-yellow-600' },
        ];

        async function cargarDashboard() {
            let datos = {};
            try {
                datos = await api('/dashboard');
            } catch (_) { toast('No se pudieron cargar los indicadores', 'error'); }

            const cardsEl = document.getElementById('cards');
            cardsEl.innerHTML = definicionCards.map(def => {
                let valor = datos[def.key];
                if (def.dinero) valor = dinero(valor);
                else if (valor === undefined || valor === null) valor = '—';
                return `
                <div class="card stat-card p-5">
                    <div class="flex items-start justify-between">
                        <div>
                            <p class="text-xs text-slate-500 font-medium">${def.titulo}</p>
                            <p class="text-3xl font-extrabold text-slate-800 mt-2">${valor}</p>
                        </div>
                        <div class="stat-icon ${def.color}">${def.icono}</div>
                    </div>
                </div>`;
            }).join('');

            document.getElementById('s-pendientes').textContent = datos.sesiones_pendientes ?? '—';
            document.getElementById('s-recuperaciones').textContent = datos.recuperaciones_total ?? '—';
            document.getElementById('s-inventario').textContent = datos.inventario_bajo ?? '—';

            graficaBalance(datos.ingresos_del_mes || 0, datos.gastos_del_mes || 0);
            graficaCitas();
        }

        function graficaBalance(ingresos, gastos) {
            new Chart(document.getElementById('grafica-balance'), {
                type: 'bar',
                data: {
                    labels: ['Ingresos', 'Gastos'],
                    datasets: [{
                        label: 'USD',
                        data: [ingresos, gastos],
                        backgroundColor: ['rgba(16,185,129,0.8)', 'rgba(239,68,68,0.8)'],
                        borderRadius: 10,
                        barThickness: 60,
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, ticks: { callback: v => '$' + v.toLocaleString('es-EC') } } }
                }
            });
        }

        async function graficaCitas() {
            let citas = [];
            try { citas = await api('/agenda/citas'); } catch (_) {}
            const conteo = {};
            citas.forEach(c => { conteo[c.estado] = (conteo[c.estado] || 0) + 1; });
            const colores = {
                programada: '#3b82f6', confirmada: '#22c55e', cancelada: '#ef4444',
                completada: '#10b981', reprogramada: '#f59e0b'
            };
            new Chart(document.getElementById('grafica-citas'), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(conteo),
                    datasets: [{
                        data: Object.values(conteo),
                        backgroundColor: Object.keys(conteo).map(k => colores[k] || '#94a3b8'),
                        borderWidth: 2, borderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { font: { size: 11 } } } }
                }
            });
        }

        cargarDashboard();
    </script>
</body>
</html>
