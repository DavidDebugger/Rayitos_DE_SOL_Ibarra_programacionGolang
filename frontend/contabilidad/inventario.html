<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario · Rayitos de Sol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="flex min-h-screen">
    <aside id="sidebar" class="w-64 flex-shrink-0 hidden lg:block"></aside>

    <div class="flex-1 flex flex-col min-w-0">
        <header class="topbar px-6 py-4 flex items-center justify-between lg:hidden">
            <h1 class="font-bold text-slate-800">☀️ Rayitos de Sol</h1>
        </header>
        <header class="topbar px-6 py-4 flex items-center justify-between sticky top-0 z-40">
            <div>
                <p class="text-xs text-slate-500 uppercase tracking-wide font-semibold">Contabilidad</p>
                <h2 class="text-xl font-bold text-slate-800">Inventario</h2>
            </div>
            <button class="btn btn-primary" onclick="abrirModal('modal')">＋ Nuevo Artículo</button>
        </header>

        <main class="flex-1 p-6 space-y-6">
            <div class="page-hero flex items-center justify-between">
                <div>
                    <h3 class="text-lg font-bold">📦 Materiales y Suministros</h3>
                    <p class="text-sm text-slate-300 mt-1">Control de existencias y alertas de stock bajo</p>
                </div>
                <span class="text-4xl opacity-40 hidden md:block">🏬</span>
            </div>

            <div class="card">
                <div class="p-4 border-b border-slate-100 flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between">
                    <div class="relative flex-1 max-w-md">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">🔍</span>
                        <input id="buscar" class="input pl-9" placeholder="Buscar por nombre o categoría...">
                    </div>
                    <div class="flex items-center gap-2">
                        <button class="btn btn-ghost !py-1.5 text-red-600" onclick="verBajoStock()">⚠️ Bajo stock</button>
                        <span id="contador" class="text-xs text-slate-500 font-medium"></span>
                    </div>
                </div>
                <div class="table-wrap">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th><th>Artículo</th><th>Categoría</th><th>Stock</th>
                                <th>Stock mínimo</th><th>Precio</th><th></th>
                            </tr>
                        </thead>
                        <tbody id="tabla"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div id="modal" class="hidden fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-4" onclick="cerrarModalConClick(event,'modal')">
        <div class="card modal-content w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-5">
                <h3 class="text-lg font-bold text-slate-800">📦 Nuevo Artículo</h3>
                <button onclick="cerrarModal('modal')" class="text-slate-400 hover:text-slate-600 text-xl">✕</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="md:col-span-2"><label class="text-xs font-semibold text-slate-600">Nombre *</label>
                    <input id="nombre" class="input mt-1" placeholder="Ej. Pelotas sensoriales"></div>
                <div><label class="text-xs font-semibold text-slate-600">Categoría *</label>
                    <input id="categoria" class="input mt-1" placeholder="Ej. Terapia"></div>
                <div><label class="text-xs font-semibold text-slate-600">Stock *</label>
                    <input id="stock" type="number" min="0" class="input mt-1" placeholder="Ej. 12"></div>
                <div><label class="text-xs font-semibold text-slate-600">Stock mínimo *</label>
                    <input id="stock_minimo" type="number" min="0" class="input mt-1" placeholder="Ej. 3"></div>
                <div><label class="text-xs font-semibold text-slate-600">Precio (USD) *</label>
                    <input id="precio" type="number" step="0.01" min="0" class="input mt-1" placeholder="Ej. 8.50"></div>
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button class="btn btn-ghost" onclick="cerrarModal('modal')">Cancelar</button>
                <button class="btn btn-primary" onclick="guardar()">💾 Guardar</button>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        cargarSidebar();
        let datosGlobales = [];

        async function cargar() {
            document.getElementById('tabla').innerHTML = spinnerHtml();
            try { datosGlobales = await api('/contabilidad/inventario'); }
            catch (_) { document.getElementById('tabla').innerHTML = vacioHtml('Error al cargar'); return; }
            renderizar();
        }

        function renderizar() {
            const bajo = datosGlobales.filter(i => Number(i.stock) <= Number(i.stock_minimo)).length;

            document.getElementById('contador').textContent = datosGlobales.length + ' artículo(s) · ' + bajo + ' bajo stock';
            if (!datosGlobales.length) { document.getElementById('tabla').innerHTML = vacioHtml(); return; }

            document.getElementById('tabla').innerHTML = datosGlobales.map(i => {
                const esBajo = Number(i.stock) <= Number(i.stock_minimo);
                return `
                <tr>
                    <td class="font-medium text-slate-500">#${i.id}</td>
                    <td><p class="font-semibold text-slate-800">${escapeHtml(i.nombre || '')}</p></td>
                    <td><span class="badge badge-amber">${escapeHtml(i.categoria || '—')}</span></td>
                    <td>${esBajo
                        ? `<span class="badge badge-red">${i.stock} ⚠️</span>`
                        : `<span class="badge badge-green">${i.stock}</span>`}</td>
                    <td>${i.stock_minimo}</td>
                    <td class="font-semibold text-emerald-600">$${Number(i.precio || 0).toFixed(2)}</td>
                    <td class="text-right whitespace-nowrap">
                        <button class="btn btn-ghost !px-2 !py-1" title="Eliminar" onclick="eliminar(${i.id})">🗑️</button>
                    </td>
                </tr>`;
            }).join('');

            initBusqueda('buscar', '#tabla tr');
        }

        async function verBajoStock() {
            document.getElementById('tabla').innerHTML = spinnerHtml();
            try {
                const datos = await api('/contabilidad/inventario/bajo-stock');
                datosGlobales = datos;
            } catch (_) { document.getElementById('tabla').innerHTML = vacioHtml('Error al cargar'); return; }
            renderizar();
        }

        function validar() {
            let ok = true;
            ['nombre', 'categoria', 'stock', 'stock_minimo', 'precio'].forEach(id => {
                const el = document.getElementById(id);
                const invalido = !el.value;
                el.classList.toggle('input-error', invalido);
                if (invalido) ok = false;
            });
            return ok;
        }

        async function guardar() {
            if (!validar()) { toast('Complete los campos obligatorios', 'error'); return; }
            const body = {
                nombre: document.getElementById('nombre').value,
                categoria: document.getElementById('categoria').value,
                stock: parseInt(document.getElementById('stock').value),
                stock_minimo: parseInt(document.getElementById('stock_minimo').value),
                precio: parseFloat(document.getElementById('precio').value)
            };
            try {
                await api('/contabilidad/inventario', { method: 'POST', body: JSON.stringify(body) });
                toast('Artículo agregado correctamente');
                cerrarModal('modal');
                ['nombre','categoria','stock','stock_minimo','precio'].forEach(id => document.getElementById(id).value = '');
                cargar();
            } catch (e) { toast(e.message, 'error'); }
        }

        async function eliminar(id) {
            if (!(await confirmar('¿Eliminar este artículo?'))) return;
            try {
                await api('/contabilidad/inventario/' + id, { method: 'DELETE' });
                toast('Artículo eliminado');
                cargar();
            } catch (e) { toast(e.message, 'error'); }
        }

        cargar();
    </script>
</body>
</html>
