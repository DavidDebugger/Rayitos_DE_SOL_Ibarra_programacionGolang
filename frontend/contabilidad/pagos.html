<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagos · Rayitos de Sol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="flex min-h-screen">
    <aside id="sidebar" class="w-64 flex-shrink-0 hidden lg:block"></aside>

    <div class="flex-1 flex flex-col min-w-0">
        <header class="topbar px-6 py-4 flex items-center justify-between lg:hidden">
            <h1 class="font-bold text-slate-800">☀️ Rayitos de Sol</h1>
        </header>
        <header class="topbar px-6 py-4 flex items-center justify-between sticky top-0 z-40">
            <div>
                <p class="text-xs text-slate-500 uppercase tracking-wide font-semibold">Contabilidad</p>
                <h2 class="text-xl font-bold text-slate-800">Pagos</h2>
            </div>
            <button class="btn btn-primary" onclick="abrirModal('modal')">＋ Nuevo Pago</button>
        </header>

        <main class="flex-1 p-6 space-y-6">
            <div class="page-hero flex items-center justify-between">
                <div>
                    <h3 class="text-lg font-bold">💳 Pagos de Facturas</h3>
                    <p class="text-sm text-slate-300 mt-1">Registro de abonos y cobros por servicios</p>
                </div>
                <span class="text-4xl opacity-40 hidden md:block">💵</span>
            </div>

            <div class="card">
                <div class="p-4 border-b border-slate-100 flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between">
                    <div class="relative flex-1 max-w-md">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">🔍</span>
                        <input id="buscar" class="input pl-9" placeholder="Buscar por factura o método de pago...">
                    </div>
                    <span id="contador" class="text-xs text-slate-500 font-medium"></span>
                </div>
                <div class="table-wrap">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th><th>Factura</th><th>Método</th><th>Monto</th>
                                <th>Fecha</th><th></th>
                            </tr>
                        </thead>
                        <tbody id="tabla"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div id="modal" class="hidden fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-4" onclick="cerrarModalConClick(event,'modal')">
        <div class="card modal-content w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-5">
                <h3 class="text-lg font-bold text-slate-800">💳 Nuevo Pago</h3>
                <button onclick="cerrarModal('modal')" class="text-slate-400 hover:text-slate-600 text-xl">✕</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="md:col-span-2"><label class="text-xs font-semibold text-slate-600">Factura *</label>
                    <select id="factura_id" class="input mt-1"></select></div>
                <div><label class="text-xs font-semibold text-slate-600">Método *</label>
                    <select id="metodo" class="input mt-1">
                        <option value="">Seleccionar</option>
                        <option>efectivo</option><option>transferencia</option><option>tarjeta</option>
                    </select></div>
                <div><label class="text-xs font-semibold text-slate-600">Monto (USD) *</label>
                    <input id="monto" type="number" step="0.01" min="0" class="input mt-1" placeholder="Ej. 56.00"></div>
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button class="btn btn-ghost" onclick="cerrarModal('modal')">Cancelar</button>
                <button class="btn btn-primary" onclick="guardar()">💾 Guardar</button>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        cargarSidebar();

        async function cargar() {
            document.getElementById('tabla').innerHTML = spinnerHtml();
            let datos = [];
            try { datos = await api('/contabilidad/pagos'); }
            catch (_) { document.getElementById('tabla').innerHTML = vacioHtml('Error al cargar'); return; }

            document.getElementById('contador').textContent = datos.length + ' pago(s)';
            if (!datos.length) { document.getElementById('tabla').innerHTML = vacioHtml(); return; }

            document.getElementById('tabla').innerHTML = datos.map(p => `
                <tr>
                    <td class="font-medium text-slate-500">#${p.id}</td>
                    <td>${p.factura_id ? 'Factura #' + p.factura_id : '—'}</td>
                    <td><span class="badge badge-blue">${escapeHtml(p.metodo || '—')}</span></td>
                    <td class="font-semibold text-emerald-600">$${Number(p.monto || 0).toFixed(2)}</td>
                    <td>${fechaCorta(p.fecha)}</td>
                    <td class="text-right whitespace-nowrap">
                        <button class="btn btn-ghost !px-2 !py-1" title="Eliminar" onclick="eliminar(${p.id})">🗑️</button>
                    </td>
                </tr>`).join('');

            initBusqueda('buscar', '#tabla tr');
        }

        async function cargarSelects() {
            await llenarSelect('/contabilidad/facturas', 'factura_id', f => `Factura #${f.id} — ${f.concepto} ($${Number(f.total || 0).toFixed(2)})`);
        }

        function validar() {
            let ok = true;
            ['factura_id', 'metodo', 'monto'].forEach(id => {
                const el = document.getElementById(id);
                const invalido = !el.value;
                el.classList.toggle('input-error', invalido);
                if (invalido) ok = false;
            });
            return ok;
        }

        async function guardar() {
            if (!validar()) { toast('Complete los campos obligatorios', 'error'); return; }
            const body = {
                factura_id: parseInt(document.getElementById('factura_id').value),
                metodo: document.getElementById('metodo').value,
                monto: parseFloat(document.getElementById('monto').value)
            };
            try {
                await api('/contabilidad/pagos', { method: 'POST', body: JSON.stringify(body) });
                toast('Pago registrado correctamente');
                cerrarModal('modal');
                ['factura_id','metodo','monto'].forEach(id => document.getElementById(id).value = '');
                cargar();
            } catch (e) { toast(e.message, 'error'); }
        }

        async function eliminar(id) {
            if (!(await confirmar('¿Eliminar este pago?'))) return;
            try {
                await api('/contabilidad/pagos/' + id, { method: 'DELETE' });
                toast('Pago eliminado');
                cargar();
            } catch (e) { toast(e.message, 'error'); }
        }

        cargar();
        cargarSelects();
    </script>
</body>
</html>
