<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencias · Rayitos de Sol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="flex min-h-screen">
    <aside id="sidebar" class="w-64 flex-shrink-0 hidden lg:block"></aside>

    <div class="flex-1 flex flex-col min-w-0">
        <header class="topbar px-6 py-4 flex items-center justify-between lg:hidden">
            <h1 class="font-bold text-slate-800">☀️ Rayitos de Sol</h1>
        </header>
        <header class="topbar px-6 py-4 flex items-center justify-between sticky top-0 z-40">
            <div>
                <p class="text-xs text-slate-500 uppercase tracking-wide font-semibold">Agenda</p>
                <h2 class="text-xl font-bold text-slate-800">Asistencias</h2>
            </div>
            <button class="btn btn-primary" onclick="abrirModal('modal')">＋ Nueva Asistencia</button>
        </header>

        <main class="flex-1 p-6 space-y-6">
            <div class="page-hero flex items-center justify-between">
                <div>
                    <h3 class="text-lg font-bold">✅ Registro de Asistencia</h3>
                    <p class="text-sm text-slate-300 mt-1">Control de sesiones asistidas por estudiante</p>
                </div>
                <span class="text-4xl opacity-40 hidden md:block">📋</span>
            </div>

            <div class="card">
                <div class="p-4 border-b border-slate-100 flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between">
                    <div class="relative flex-1 max-w-md">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">🔍</span>
                        <input id="buscar" class="input pl-9" placeholder="Buscar por estudiante o tipo de sesión...">
                    </div>
                    <div class="flex items-center gap-2">
                        <select id="filtro-estado" class="input !w-auto">
                            <option value="">Todas</option>
                            <option>asistio</option><option>falto</option><option>justificada</option>
                        </select>
                        <span id="contador" class="text-xs text-slate-500 font-medium"></span>
                    </div>
                </div>
                <div class="table-wrap">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th><th>Estudiante</th><th>Fecha</th><th>Tipo de sesión</th>
                                <th>Estado</th><th>Observación</th><th></th>
                            </tr>
                        </thead>
                        <tbody id="tabla"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div id="modal" class="hidden fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-4" onclick="cerrarModalConClick(event,'modal')">
        <div class="card modal-content w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-5">
                <h3 class="text-lg font-bold text-slate-800">✅ Nueva Asistencia</h3>
                <button onclick="cerrarModal('modal')" class="text-slate-400 hover:text-slate-600 text-xl">✕</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="md:col-span-2"><label class="text-xs font-semibold text-slate-600">Estudiante *</label>
                    <select id="estudiante_id" class="input mt-1"></select></div>
                <div><label class="text-xs font-semibold text-slate-600">Fecha *</label>
                    <input id="fecha" type="date" class="input mt-1"></div>
                <div><label class="text-xs font-semibold text-slate-600">Estado *</label>
                    <select id="estado" class="input mt-1">
                        <option value="">Seleccionar</option>
                        <option>asistio</option><option>falto</option><option>justificada</option>
                    </select></div>
                <div class="md:col-span-2"><label class="text-xs font-semibold text-slate-600">Tipo de sesión *</label>
                    <select id="tipo" class="input mt-1">
                        <option value="">Seleccionar</option>
                        <option>Terapia física</option><option>Terapia ocupacional</option>
                        <option>Terapia de lenguaje</option><option>Psicología</option>
                    </select></div>
                <div class="md:col-span-2"><label class="text-xs font-semibold text-slate-600">Observación</label>
                    <textarea id="observacion" rows="2" class="input mt-1" placeholder="Notas de la sesión"></textarea></div>
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button class="btn btn-ghost" onclick="cerrarModal('modal')">Cancelar</button>
                <button class="btn btn-primary" onclick="guardar()">💾 Guardar</button>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        cargarSidebar();
        let datosGlobales = [];

        async function cargar() {
            document.getElementById('tabla').innerHTML = spinnerHtml();
            try { datosGlobales = await api('/agenda/asistencias'); }
            catch (_) { document.getElementById('tabla').innerHTML = vacioHtml('Error al cargar'); return; }
            renderizar();
        }

        function renderizar() {
            const filtro = document.getElementById('filtro-estado').value;
            let datos = datosGlobales;
            if (filtro) datos = datos.filter(a => a.estado === filtro);

            document.getElementById('contador').textContent = datos.length + ' registro(s)';
            if (!datos.length) { document.getElementById('tabla').innerHTML = vacioHtml(); return; }

            document.getElementById('tabla').innerHTML = datos.map(a => `
                <tr>
                    <td class="font-medium text-slate-500">#${a.id}</td>
                    <td><p class="font-semibold text-slate-800">Est. #${a.estudiante_id}</p></td>
                    <td>${fechaCorta(a.fecha)}</td>
                    <td>${escapeHtml(a.tipo || '—')}</td>
                    <td>${badge(a.estado)}</td>
                    <td class="text-xs text-slate-500 max-w-[200px] truncate">${escapeHtml(a.observacion || '—')}</td>
                    <td class="text-right whitespace-nowrap">
                        <button class="btn btn-ghost !px-2 !py-1" title="Eliminar" onclick="eliminar(${a.id})">🗑️</button>
                    </td>
                </tr>`).join('');

            initBusqueda('buscar', '#tabla tr');
        }

        document.getElementById('filtro-estado').addEventListener('change', renderizar);

        async function cargarSelects() {
            await llenarSelect('/personas/estudiantes', 'estudiante_id', e => `${e.nombres} ${e.apellidos}`);
        }

        function validar() {
            let ok = true;
            ['estudiante_id', 'fecha', 'estado', 'tipo'].forEach(id => {
                const el = document.getElementById(id);
                const invalido = !el.value;
                el.classList.toggle('input-error', invalido);
                if (invalido) ok = false;
            });
            return ok;
        }

        async function guardar() {
            if (!validar()) { toast('Complete los campos obligatorios', 'error'); return; }
            const body = {
                estudiante_id: parseInt(document.getElementById('estudiante_id').value),
                fecha: document.getElementById('fecha').value,
                estado: document.getElementById('estado').value,
                tipo: document.getElementById('tipo').value,
                observacion: document.getElementById('observacion').value
            };
            try {
                await api('/agenda/asistencias', { method: 'POST', body: JSON.stringify(body) });
                toast('Asistencia registrada correctamente');
                cerrarModal('modal');
                ['estudiante_id','fecha','estado','tipo','observacion'].forEach(id => document.getElementById(id).value = '');
                cargar();
            } catch (e) { toast(e.message, 'error'); }
        }

        async function eliminar(id) {
            if (!(await confirmar('¿Eliminar este registro de asistencia?'))) return;
            try {
                await api('/agenda/asistencias/' + id, { method: 'DELETE' });
                toast('Asistencia eliminada');
                cargar();
            } catch (e) { toast(e.message, 'error'); }
        }

        cargar();
        cargarSelects();
    </script>
</body>
</html>
