<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperaciones · Rayitos de Sol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="flex min-h-screen">
    <aside id="sidebar" class="w-64 flex-shrink-0 hidden lg:block"></aside>

    <div class="flex-1 flex flex-col min-w-0">
        <header class="topbar px-6 py-4 flex items-center justify-between lg:hidden">
            <h1 class="font-bold text-slate-800">☀️ Rayitos de Sol</h1>
        </header>
        <header class="topbar px-6 py-4 flex items-center justify-between sticky top-0 z-40">
            <div>
                <p class="text-xs text-slate-500 uppercase tracking-wide font-semibold">Agenda</p>
                <h2 class="text-xl font-bold text-slate-800">Recuperaciones</h2>
            </div>
            <button class="btn btn-primary" onclick="abrirModal('modal')">＋ Nueva Recuperación</button>
        </header>

        <main class="flex-1 p-6 space-y-6">
            <div class="page-hero flex items-center justify-between">
                <div>
                    <h3 class="text-lg font-bold">🔄 Sesiones de Recuperación</h3>
                    <p class="text-sm text-slate-300 mt-1">Sesiones reprogramadas de citas no asistidas</p>
                </div>
                <span class="text-4xl opacity-40 hidden md:block">🔁</span>
            </div>

            <div class="card">
                <div class="p-4 border-b border-slate-100 flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between">
                    <div class="relative flex-1 max-w-md">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">🔍</span>
                        <input id="buscar" class="input pl-9" placeholder="Buscar por cita, estudiante o motivo...">
                    </div>
                    <div class="flex items-center gap-2">
                        <select id="filtro-estado" class="input !w-auto">
                            <option value="">Todas</option>
                            <option>programada</option><option>realizada</option><option>cancelada</option>
                        </select>
                        <span id="contador" class="text-xs text-slate-500 font-medium"></span>
                    </div>
                </div>
                <div class="table-wrap">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th><th>Cita</th><th>Motivo</th><th>Fecha</th>
                                <th>Estado</th><th></th>
                            </tr>
                        </thead>
                        <tbody id="tabla"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div id="modal" class="hidden fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-4" onclick="cerrarModalConClick(event,'modal')">
        <div class="card modal-content w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-5">
                <h3 class="text-lg font-bold text-slate-800">🔄 Nueva Recuperación</h3>
                <button onclick="cerrarModal('modal')" class="text-slate-400 hover:text-slate-600 text-xl">✕</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="md:col-span-2"><label class="text-xs font-semibold text-slate-600">Cita original *</label>
                    <select id="cita_id" class="input mt-1"></select></div>
                <div><label class="text-xs font-semibold text-slate-600">Fecha de recuperación *</label>
                    <input id="fecha" type="date" class="input mt-1"></div>
                <div><label class="text-xs font-semibold text-slate-600">Hora *</label>
                    <input id="hora" type="time" class="input mt-1"></div>
                <div class="md:col-span-2"><label class="text-xs font-semibold text-slate-600">Motivo *</label>
                    <input id="motivo" class="input mt-1" placeholder="Ej. Inasistencia del estudiante"></div>
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button class="btn btn-ghost" onclick="cerrarModal('modal')">Cancelar</button>
                <button class="btn btn-primary" onclick="guardar()">💾 Guardar</button>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        cargarSidebar();
        let datosGlobales = [];

        async function cargar() {
            document.getElementById('tabla').innerHTML = spinnerHtml();
            try { datosGlobales = await api('/agenda/recuperaciones'); }
            catch (_) { document.getElementById('tabla').innerHTML = vacioHtml('Error al cargar'); return; }
            renderizar();
        }

        function renderizar() {
            const filtro = document.getElementById('filtro-estado').value;
            let datos = datosGlobales;
            if (filtro) datos = datos.filter(r => r.estado === filtro);

            document.getElementById('contador').textContent = datos.length + ' recuperación(es)';
            if (!datos.length) { document.getElementById('tabla').innerHTML = vacioHtml(); return; }

            document.getElementById('tabla').innerHTML = datos.map(r => `
                <tr>
                    <td class="font-medium text-slate-500">#${r.id}</td>
                    <td>${r.cita_id ? 'Cita #' + r.cita_id : '—'}</td>
                    <td class="max-w-[220px] truncate text-xs text-slate-500">${escapeHtml(r.motivo || '—')}</td>
                    <td>${fechaCorta(r.fecha)} <span class="text-xs text-slate-400">${horaCorta(r.hora)}</span></td>
                    <td>${badge(r.estado)}</td>
                    <td class="text-right whitespace-nowrap">
                        ${r.estado === 'programada' ? `
                        <button class="btn btn-ghost !px-2 !py-1 text-green-600" title="Marcar realizada" onclick="cambiarEstado(${r.id},'realizada')">✔️</button>
                        <button class="btn btn-ghost !px-2 !py-1 text-red-600" title="Cancelar" onclick="cambiarEstado(${r.id},'cancelada')">✖️</button>` : ''}
                    </td>
                </tr>`).join('');

            initBusqueda('buscar', '#tabla tr');
        }

        document.getElementById('filtro-estado').addEventListener('change', renderizar);

        async function cargarSelects() {
            await llenarSelect('/agenda/citas', 'cita_id', c => `Cita #${c.id} — ${c.tipo} (${c.fecha})`);
        }

        function validar() {
            let ok = true;
            ['cita_id', 'fecha', 'hora', 'motivo'].forEach(id => {
                const el = document.getElementById(id);
                const invalido = !el.value;
                el.classList.toggle('input-error', invalido);
                if (invalido) ok = false;
            });
            return ok;
        }

        async function guardar() {
            if (!validar()) { toast('Complete los campos obligatorios', 'error'); return; }
            const body = {
                cita_id: parseInt(document.getElementById('cita_id').value),
                fecha: document.getElementById('fecha').value,
                hora: document.getElementById('hora').value,
                motivo: document.getElementById('motivo').value
            };
            try {
                await api('/agenda/recuperaciones', { method: 'POST', body: JSON.stringify(body) });
                toast('Recuperación programada correctamente');
                cerrarModal('modal');
                ['cita_id','fecha','hora','motivo'].forEach(id => document.getElementById(id).value = '');
                cargar();
            } catch (e) { toast(e.message, 'error'); }
        }

        async function cambiarEstado(id, estado) {
            if (!(await confirmar('¿Marcar como "' + estado + '"?'))) return;
            try {
                await api('/agenda/recuperaciones/' + id, { method: 'PUT', body: JSON.stringify({ estado }) });
                toast('Estado actualizado');
                cargar();
            } catch (e) { toast(e.message, 'error'); }
        }

        cargar();
        cargarSelects();
    </script>
</body>
</html>
